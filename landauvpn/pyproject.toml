[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landauvpn"
version = "1.0.0"
description = "LandauVPN — Менеджер VPN и прокси для обхода блокировок"
authors = [
    { name = "LandauVPN Team" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "customtkinter>=5.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
landauvpn = "landauvpn.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["landauvpn*"]
